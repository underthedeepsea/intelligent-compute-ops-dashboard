# Optional PostgreSQL deployment. Public access requires a trusted TLS proxy.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/control-api:${IMAGE_VERSION:?set IMAGE_VERSION}
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    env_file: .env
    environment: {DATABASE_ENGINE: postgresql, PGHOST: db, PGDATABASE: control_plane, PGUSER: control_plane}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/control-api:${IMAGE_VERSION:?set IMAGE_VERSION}
    build: {context: .., dockerfile: deploy/Dockerfile, target: api}
    profiles: [inspection]
    env_file: .env
    environment: {DATABASE_ENGINE: postgresql, PGHOST: db, PGDATABASE: control_plane, PGUSER: control_plane}
    command: ["python", "manage.py", "poll_inspection"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/control-web:${IMAGE_VERSION:?set IMAGE_VERSION}
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    ports: ["127.0.0.1:8088:8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
