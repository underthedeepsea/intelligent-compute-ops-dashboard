# First-time provisioning only. Private admin secret must be created separately.
# Stop/wait for every API Pod first. Never run alongside API/another Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: control-create-admin
  namespace: ai-ops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app: control-maintenance}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admin
          image: registry.example.invalid/control/control-api:0.2.0
          args:
            - /bin/sh
            - -ec
            - 'python manage.py createsuperuser --noinput && python manage.py bootstrap_access --username "$DJANGO_SUPERUSER_USERNAME" --role catalog_admin --environment "$CONTROL_ADMIN_ENVIRONMENT"'
          env:
            - {name: CONTROL_ADMIN_ENVIRONMENT, value: REPLACE_WITH_ENVIRONMENT_CODE}
          envFrom:
            - configMapRef: {name: control-config}
            - secretRef: {name: control-secrets}
            - secretRef: {name: control-admin-bootstrap}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: control-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
