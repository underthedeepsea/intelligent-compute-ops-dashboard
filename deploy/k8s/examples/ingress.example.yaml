# Adapt to your installed TLS ingress controller. Not in default kustomization.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control
  namespace: ai-ops
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS
  tls:
    - hosts: [control.example.internal]
      secretName: control-tls
  rules:
    - host: control.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}
