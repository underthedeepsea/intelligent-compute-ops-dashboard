apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-ops
resources:
  - ../base
components:
  - config
images:
  # Base already transforms these image names, so override the resulting names.
  - name: registry.example.invalid/control/control-api
    newTag: 0.3.0
  - name: registry.example.invalid/control/control-web
    newTag: 0.3.0
patches:
  - path: web-patch.yaml
