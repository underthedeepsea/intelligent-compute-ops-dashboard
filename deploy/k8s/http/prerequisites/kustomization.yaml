apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-ops
resources:
  # Referencing the containing HTTP directory creates a Kustomize cycle.
  - ../../base
components:
  - ../config
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-api
        namespace: ai-ops
      $patch: delete
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-web
        namespace: ai-ops
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: api
        namespace: ai-ops
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: web
        namespace: ai-ops
      $patch: delete
# Install configuration and storage without starting application/database users.
