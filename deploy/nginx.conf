worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Only accept traffic through a trusted ingress that overwrites this header.
  map $http_x_forwarded_proto $external_proto {
    default $scheme;
    https https;
    http http;
  }
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /web-healthz { access_log off; return 200 "ok\n"; }
    location = /api/v1/session/login {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_read_timeout 30s;
      proxy_pass http://api:8000;
    }
    location ~ ^/(api(?:/|$)|admin(?:/|$)|healthz$|readyz$) {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_read_timeout 30s;
      proxy_pass http://api:8000;
    }
    location /static/ { alias /usr/share/nginx/static/; }
    location = / { return 302 /screen/index.html; }
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri $uri/ =404; }
  }
}
