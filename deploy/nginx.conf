worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Only accept traffic through a trusted ingress that overwrites this header.
  map $http_x_forwarded_proto $external_proto {
    default $scheme;
    https https;
    http http;
  }
  # Raw masked namespace controls headers even for server-level traversal rejection.
  map $request_uri $masked_request {
    default 0;
    ~*^/screen-masked(?:/|%2f|%5c|\?|$) 1;
  }
  map $masked_request $masked_cache_control { default ""; 1 "no-store"; }
  map $masked_request $masked_frame_options { default ""; 1 "DENY"; }
  map $masked_request $response_referrer { default "same-origin"; 1 "no-referrer"; }
  map $masked_request $masked_csp { default ""; 1 "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"; }
  server {
    listen 8080;
    server_tokens off;
    if ($request_uri ~* "^/screen-masked(?:/|%2f|%5c).*(?:\.|%2e){2}(?:/|%2f|%5c)") { return 404; }
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $response_referrer always;
    add_header Cache-Control $masked_cache_control always;
    add_header X-Frame-Options $masked_frame_options always;
    add_header Content-Security-Policy $masked_csp always;
    # mask.6: exact Web allowlist; no API or directory fallback.
    location = /screen-masked {
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      return 308 /screen-masked/;
    }
    location ^~ /screen-masked/ {
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      autoindex off;
      disable_symlinks on;
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      location = /screen-masked/ { try_files /screen-masked/index.html =404; }
      location = /screen-masked/assets/masked-gauges.js { try_files $uri =404; }
      location = /screen-masked/assets/masked-gauges.css { try_files $uri =404; }
      location = /screen-masked/assets/masked-app.js { try_files $uri =404; }
      location = /screen-masked/assets/masked-core.js { try_files $uri =404; }
      location = /screen-masked/assets/masked-curves.js { try_files $uri =404; }
      location = /screen-masked/assets/masked-diagnostics.css { try_files $uri =404; }
      location = /screen-masked/assets/masked-diagnostics.js { try_files $uri =404; }
      location = /screen-masked/assets/masked-inference.css { try_files $uri =404; }
      location = /screen-masked/assets/masked-inference.js { try_files $uri =404; }
      location = /screen-masked/assets/masked.css { try_files $uri =404; }
      location = /screen-masked/assets/refine-flow.css { try_files $uri =404; }
      location = /screen-masked/assets/refine-flow.js { try_files $uri =404; }
      location = /screen-masked/assets/refine-tokens.css { try_files $uri =404; }
      location = /screen-masked/assets/refine.css { try_files $uri =404; }
      location = /screen-masked/data/view.json { try_files $uri =404; }
      location = /screen-masked/index.html { try_files $uri =404; }
      location = /screen-masked/assets/masked03-r4.js { try_files $uri =404; }
      location = /screen-masked/assets/masked03-r4.css { try_files $uri =404; }
      location = /screen-masked/assets/masked03-r4-approved.png { types { image/png png; } default_type image/png; try_files $uri =404; }
      location = /screen-masked/assets/masked03-r4-empty.png { types { image/png png; } default_type image/png; try_files $uri =404; }
      location = /screen-masked/assets/masked03-r4-neutral.png { types { image/png png; } default_type image/png; try_files $uri =404; }
      location /screen-masked/ { return 404; }
    }
    location ^~ /screen-masked {
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      return 404;
    }
    location = /web-healthz { access_log off; return 200 "ok\n"; }
    location ~ ^/(api(?:/|$)|healthz$|readyz$) {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_read_timeout 30s;
      proxy_pass http://api:8000;
    }
    location /static/ { alias /usr/share/nginx/static/; }
    location = / { return 302 /screen/index.html; }
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri $uri/ =404; }
  }
}
